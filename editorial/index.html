<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milena &amp; Kafka — The Wedding</title>
<meta name="description" content="The wedding of Milena &amp; Kafka — Saturday, 12 December 2026 · Solo, Indonesia. You are warmly invited." />
<meta property="og:type" content="website" />
<meta property="og:title" content="The Wedding of Milena &amp; Kafka" />
<meta property="og:description" content="Saturday, 12 December 2026 · Solo, Indonesia" />
<meta property="og:image" content="https://chud-lori.github.io/ulem/photos/og-image.jpg" />
<meta property="og:url" content="https://chud-lori.github.io/ulem/editorial/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#eee7dc;--ink:#111516;--muted:#6d6760;--accent:#9f6a4d;--green:#365b56;--paper:#fbf7ef;--line:#d3c7b9}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg) url("assets/editorial-paper.svg") center/cover fixed;color:var(--ink);line-height:1.65}
  button,input,select,textarea{font:inherit}
  .wrap{width:min(1120px,calc(100% - 28px));margin:auto}
  .hero{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:28px;padding:48px 0 32px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:3px;font-weight:800;color:var(--accent)}
  h1,h2{font-family:"Cormorant Garamond",serif;line-height:.96;font-weight:700}
  h1{font-size:clamp(62px,13vw,150px);letter-spacing:-1px}
  h2{font-size:clamp(38px,8vw,82px)}
  .amp{color:var(--accent);font-style:italic}.date{font-size:clamp(15px,3vw,20px);color:var(--muted);margin-top:16px}
  .cover-card{background:#111516;color:#fbf7ef;border-radius:10px;padding:22px;box-shadow:0 28px 80px #0005}
  .cover-photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#1a2021;border-radius:4px}
  .dock{position:sticky;top:0;z-index:10;background:rgba(238,231,220,.92);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
  .dock .wrap{display:flex;gap:8px;overflow:auto;padding:10px 14px}.dock a{white-space:nowrap;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800}.dock a:last-child{background:var(--accent);color:#fff;border-color:var(--accent)}
  section{padding:76px 0}.panel{background:rgba(251,247,239,.9);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 18px 50px #0001}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fffaf2;border:1px solid var(--line);border-radius:8px;padding:18px}
  .story-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee7dc;border-radius:6px;margin-bottom:12px}
  .detail{display:flex;gap:14px;margin:10px 0}.k{min-width:84px;color:var(--accent);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:1px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;background:var(--ink);color:#fff;padding:13px 16px;border-radius:4px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}a.btn{display:inline-block;text-decoration:none;text-align:center}
  .countdown{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.cd{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:72px;text-align:center}.cd b{display:block;font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1}.cd span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800}
  .timeline{margin-top:20px;border-top:1px solid var(--line)}.tl{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}.tl b{min-width:84px;color:var(--accent);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:1px;padding-top:3px}
  .invite-list{list-style:none;columns:2;column-gap:24px}.invite-list li{padding:9px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
  .note{margin-top:12px;color:var(--accent);font-weight:700}
  label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;padding:12px;color:var(--ink);border-radius:4px}
  .wish{border-left:4px solid var(--green);background:#fff;padding:10px 12px;margin:8px 0}.wish b{display:block;color:var(--green)}
  .floating{position:fixed;right:16px;bottom:16px;z-index:12;display:flex;gap:8px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease,visibility .35s}.floating.show{opacity:1;visibility:visible;transform:none}.floating button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:12px 14px;font-weight:800;box-shadow:0 12px 24px #0002}
  @media(max-width:800px){body{background-attachment:scroll}.hero{grid-template-columns:1fr;align-items:center;padding-top:28px}.cover-card{order:-1;padding:14px}.cover-photo{aspect-ratio:auto;height:min(36vh,320px)}section{padding:54px 0}.floating{left:14px;right:14px}.floating button{flex:1}.invite-list{columns:1}}
</style>
</head>
<body>
<section class="hero wrap">
  <div>
    <div class="eyebrow">The wedding of</div>
    <h1 id="names">&nbsp;</h1>
    <p class="date" id="date"></p>
    <div class="countdown" id="countdown"></div>
    <div class="actions"><button class="btn" onclick="document.getElementById('rsvp').scrollIntoView({behavior:'smooth'})">RSVP</button><button class="btn alt" onclick="document.getElementById('details').scrollIntoView({behavior:'smooth'})">Details</button></div>
  </div>
  <div class="cover-card"><img class="cover-photo" id="coverPhoto" src="../photos/couple.png" alt="Milena &amp; Kafka" /></div>
</section>
<nav class="dock"><div class="wrap" id="nav"></div></nav>
<main>
  <section id="story" class="wrap"><div class="eyebrow">Story</div><h2>How The Chapter Opens</h2><div class="grid" id="storyGrid"></div></section>
  <section id="turut" class="wrap" hidden><div class="eyebrow">With Love</div><h2>Turut Mengundang</h2><div class="panel"><ul class="invite-list" id="turutList"></ul></div></section>
  <section id="details" class="wrap"><div class="eyebrow">Details</div><h2>The Day</h2><div class="panel" id="detailsBox"></div></section>
  <section id="guide" class="wrap"><div class="eyebrow">Guest Guide</div><h2>Before You Come</h2><div class="grid" id="guideGrid"></div></section>
  <section id="gift" class="wrap"><div class="eyebrow">In Lieu Of Gifts</div><h2>Book Gift</h2><div class="panel" id="giftBox"></div></section>
  <section id="wishes" class="wrap"><div class="eyebrow">Guestbook</div><h2>Wishes</h2><div class="panel" id="wishesBox"></div></section>
  <section id="rsvp" class="wrap"><div class="eyebrow">Reply</div><h2>RSVP</h2><div class="panel" id="rsvpBox"></div></section>
</main>
<div class="floating"><button onclick="document.getElementById('rsvp').scrollIntoView({behavior:'smooth'})">RSVP</button><button onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Map</button></div>
<script src="../data.js"></script><script src="template-data.js"></script><script src="../opener.js"></script><script src="../config.local.js" onerror=""></script><script type="module" src="../firebase.js"></script><script src="../music.js" defer></script>
<script>
const W=window.WEDDING,T=window.TEMPLATE||{},PARAMS=new URLSearchParams(location.search),GUEST=(PARAMS.get("to")||"").trim().slice(0,40)||null,OPEN=(PARAMS.get("open")||"").trim()||null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PHOTO_FALLBACK="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><rect width='800' height='600' fill='#eee7dc'/><rect x='26' y='26' width='748' height='548' fill='none' stroke='#d3c7b9' stroke-width='2'/><rect x='40' y='40' width='720' height='520' fill='none' stroke='#d3c7b9'/><path d='M330 186h140M330 424h140' stroke='#9f6a4d' stroke-width='2'/><text x='400' y='352' text-anchor='middle' font-family='Georgia,serif' font-size='160' font-style='italic' fill='#9f6a4d'>&amp;</text></svg>");
function photoFallback(img){img.onerror=null;img.src=PHOTO_FALLBACK;}
(function(){const p=document.getElementById("coverPhoto");if(!p)return;if(p.complete&&p.naturalWidth===0)photoFallback(p);else p.addEventListener("error",()=>photoFallback(p),{once:true});})();
names.innerHTML=`${W.bride}<span class="amp"> &amp; </span>${W.groom}`;date.textContent=W.dateLabel;
nav.innerHTML=(T.nav||[]).map(([label,id])=>`<a href="#${id}">${label}</a>`).join("");
storyGrid.innerHTML=W.story.map(s=>`<article class="card story-card" id="story-${s.id}"><img src="../photos/${s.photo}" onerror="photoFallback(this)"><div class="eyebrow">${s.icon} ${s.label}</div><h2 style="font-size:34px">${s.title}</h2>${s.html}</article>`).join("");
if(Array.isArray(W.turutMengundang)&&W.turutMengundang.length){turut.hidden=false;turutList.innerHTML=W.turutMengundang.map(t=>`<li>${t}</li>`).join("");}
function calDates(){const d=new Date(W.date),pad=n=>String(n).padStart(2,"0"),fmt=t=>t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+"T"+pad(t.getUTCHours())+pad(t.getUTCMinutes())+"00Z";return[fmt(d),fmt(new Date(d.getTime()+5*3600e3))];}
function gcalUrl(){const[a,b]=calDates();return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(`${W.bride} & ${W.groom} Wedding`)+"&dates="+a+"/"+b+"&location="+encodeURIComponent(`${W.venueName}, ${W.venueAddress}`);}
detailsBox.innerHTML=`<div class="grid"><div><div class="detail"><span class="k">When</span><span>${W.dateLabel}<br>${W.ceremonyTime}</span></div></div><div><div class="detail"><span class="k">Where</span><span>${W.venueName}<br>${W.venueAddress}</span></div></div><div><div class="detail"><span class="k">Dress</span><span>${W.dress}</span></div></div></div>${(W.agenda&&W.agenda.length)?`<div class="timeline">${W.agenda.map(a=>`<div class="tl"><b>${a.time}</b><span>${a.label}</span></div>`).join("")}</div>`:""}<div class="actions"><button class="btn" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Open Map</button><button class="btn alt" onclick="addToCalendar()">Add Calendar</button><a class="btn alt" href="${gcalUrl()}" target="_blank" rel="noopener">Google Calendar</a>${(W.streaming&&W.streaming.url)?`<a class="btn" href="${W.streaming.url}" target="_blank" rel="noopener">${W.streaming.label||"Watch the ceremony live"}${W.streaming.time?` · ${W.streaming.time}`:""}</a>`:""}</div>`;
guideGrid.innerHTML=(T.guide||[]).map(([h,b])=>`<article class="card"><div class="eyebrow">${h}</div><p>${b}</p></article>`).join("");
function giftWaUrl(g){const phone=String((g&&g.whatsapp)||"").replace(/\D/g,""),text=encodeURIComponent((g&&g.whatsappText)||"Hi, I'd like to send a book as a wedding gift. Could you share the shipping address?");return phone?`https://wa.me/${phone}?text=${text}`:`https://wa.me/?text=${text}`;}
giftBox.innerHTML=`<p>${W.gift.note}</p><div class="actions"><button class="btn" onclick="window.open(giftWaUrl(W.gift),'_blank')">Ask Shipping Address</button></div><p style="color:var(--muted);margin-top:10px">We only share the address through WhatsApp so it stays private.</p>`;
wishesBox.innerHTML=`<form id="wishForm"><label>Your name</label><input name="name" required><label>Your wish</label><textarea name="msg" rows="3" required></textarea><div class="actions"><button class="btn">Send Wish</button></div></form><p class="note" id="wishStatus" hidden></p><div id="wishList"><p id="wishNote">Loading wishes...</p></div>`;
rsvpBox.innerHTML=`<form id="rsvpForm"><label>Your name</label><input name="name" required><label>Will you attend?</label><select name="attending"><option>Joyfully accepts</option><option>Sadly declines</option></select><label>Guests</label><input name="guests" type="number" min="1" value="1"><label>Note</label><textarea name="note" rows="3"></textarea><div class="actions"><button class="btn">Send RSVP</button></div></form><p class="note" id="rsvpStatus" hidden></p>`;
function withWB(fn){const WB=window.WB;if(WB)fn(WB);else addEventListener("wb-ready",()=>fn(window.WB),{once:true});}
withWB(WB=>{if(WB.ready)WB.watchWishes(items=>wishList.innerHTML=items.length?items.map(w=>`<div class="wish"><b>${esc(w.name)}</b>${esc(w.msg)}</div>`).join(""):`<p>Be the first to leave a wish.</p>`);else wishNote.textContent="Wishes will appear here once the guestbook opens — send yours above and it will reach us directly.";});
const FAIL_MSG="We couldn't record this automatically — please WhatsApp us directly.";
function sendVia(text,subject){const wa=String(W.rsvpWhatsapp||"").replace(/\D/g,"");if(wa){open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`,"_blank");return"whatsapp";}if(W.rsvpEmail){location.href=`mailto:${W.rsvpEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;return"email";}return null;}
document.addEventListener("submit",e=>{
  if(e.target.id==="wishForm"){e.preventDefault();const d=new FormData(e.target),WB=window.WB,st=document.getElementById("wishStatus");
    if(WB&&WB.ready){WB.addWish(d.get("name"),d.get("msg"));e.target.reset();st.hidden=true;}
    else{const via=sendVia(`Wedding wish from ${d.get("name")}${GUEST?` (invitation: ${GUEST})`:""}:\n${d.get("msg")}`,`Wedding wish from ${d.get("name")}`);st.hidden=false;st.textContent=via==="whatsapp"?"Your wish was sent via WhatsApp — thank you!":via==="email"?"We opened your e-mail app — press send to deliver your wish.":FAIL_MSG;if(via)e.target.reset();}}
  if(e.target.id==="rsvpForm"){e.preventDefault();const d=new FormData(e.target),data={name:d.get("name"),attending:d.get("attending"),guests:d.get("guests"),note:d.get("note"),to:GUEST||""},WB=window.WB,st=document.getElementById("rsvpStatus");
    if(WB&&WB.ready){WB.addRSVP(data);e.target.outerHTML=`<p style="font-size:20px;color:var(--accent)">Thank you, ${esc(data.name)||"friend"}. Your RSVP is in.</p>`;}
    else{const via=sendVia(`RSVP — ${data.name}\nAttending: ${data.attending}\nGuests: ${data.guests}${data.note?`\nNote: ${data.note}`:""}${GUEST?`\nInvitation for: ${GUEST}`:""}`,`RSVP — ${data.name}`);
      if(via){e.target.outerHTML=`<p style="font-size:20px;color:var(--accent)">Thank you, ${esc(data.name)||"friend"}. ${via==="whatsapp"?"Your RSVP was sent via WhatsApp.":"We opened your e-mail app — press send to deliver your RSVP."}</p>`;}
      else{st.hidden=false;st.textContent=FAIL_MSG;}}}
});
window.addToCalendar=function(){const[start,end]=calDates(),ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`SUMMARY:${W.bride} & ${W.groom} Wedding`,`DTSTART:${start}`,`DTEND:${end}`,`LOCATION:${W.venueName}, ${W.venueAddress}`,"END:VEVENT","END:VCALENDAR"].join("\n"),url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})),a=document.createElement("a");a.href=url;a.download="wedding.ics";a.click();URL.revokeObjectURL(url)}
function tickCountdown(){const safe=Math.max(0,new Date(W.date).getTime()-Date.now()),d=Math.floor(safe/864e5),h=Math.floor(safe%864e5/36e5),m=Math.floor(safe%36e5/6e4),s=Math.floor(safe%6e4/1e3);countdown.innerHTML=[["Days",d],["Hours",h],["Mins",m],["Secs",s]].map(x=>`<div class="cd"><b>${String(x[1]).padStart(2,"0")}</b><span>${x[0]}</span></div>`).join("");}
tickCountdown();setInterval(tickCountdown,1000);
if(OPEN)addEventListener("load",()=>{const el=document.getElementById(OPEN)||document.getElementById("story-"+OPEN);if(el&&!el.hidden)el.scrollIntoView({behavior:"smooth",block:"start"});});
(function(){const hero=document.querySelector(".hero"),fl=document.querySelector(".floating");if(!hero||!fl)return;
  if(!("IntersectionObserver" in window)){fl.classList.add("show");return;}
  new IntersectionObserver(en=>fl.classList.toggle("show",!en[0].isIntersecting),{threshold:.02}).observe(hero);})();
</script>
</body>
</html>
