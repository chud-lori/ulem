<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Milena &amp; Kafka — The Wedding Premiere</title>
<meta name="description" content="The wedding of Milena &amp; Kafka — Saturday, 12 December 2026 · Solo, Indonesia. One night only: you are warmly invited." />
<meta property="og:type" content="website" />
<meta property="og:title" content="The Wedding of Milena &amp; Kafka" />
<meta property="og:description" content="Saturday, 12 December 2026 · Solo, Indonesia" />
<meta property="og:image" content="https://chud-lori.github.io/ulem/photos/og-image.jpg" />
<meta property="og:url" content="https://chud-lori.github.io/ulem/cinema/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;800&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0b0908;--ink:#fff4dc;--muted:#c9b994;--red:#a62222;--red2:#541010;--gold:#d7aa55;--panel:#191210;--line:#6f4e2a}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:#0b0908;color:var(--ink);line-height:1.55;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--hero-art, url("assets/projector.jpg")) center/cover no-repeat;filter:saturate(.9) brightness(.45)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    linear-gradient(90deg,#070505 0 16%,transparent 38% 62%,#070505 84%),
    repeating-linear-gradient(90deg,transparent 0 34px,#ffffff16 35px 37px,transparent 38px 74px)}
  button,input,select,textarea{font:inherit}
  .wrap{width:min(1120px,calc(100% - 28px));margin:auto}
  .hero{min-height:100svh;display:grid;align-items:end;padding:34px 0 26px}
  .intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#4d1612,#070505 68%);padding:22px;transition:opacity .45s ease,visibility .45s}
  .intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  .admit{width:min(680px,100%);display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 28px 50px #000)}
  .stub{min-height:250px;background:linear-gradient(135deg,#f7dfad,#c99339);color:#28150d;padding:22px;border:2px solid #7d5524;position:relative;display:grid;align-content:center}
  .stub:first-child{border-radius:12px 0 0 12px}.stub:last-child{border-radius:0 12px 12px 0;border-left:2px dashed #7d5524}
  .stub h2{color:#28150d;text-shadow:none}.stub .mono{color:#5b3514}.stub .amp{color:var(--red)}
  .intro.open .stub:first-child{animation:tearLeft .65s cubic-bezier(.2,.8,.2,1) forwards}.intro.open .stub:last-child{animation:tearRight .65s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes tearLeft{to{transform:translateX(-42vw) rotate(-13deg);opacity:0}}@keyframes tearRight{to{transform:translateX(42vw) rotate(13deg);opacity:0}}
  .marquee{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:end}
  .title{padding:20px 0}
  .kicker,.mono{font-family:"Special Elite",monospace;text-transform:uppercase;letter-spacing:3px;color:var(--gold);font-size:12px}
  h1,h2{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:1px;line-height:.92;text-transform:uppercase}
  h1{font-size:clamp(62px,14vw,150px);text-shadow:0 .05em 0 #000,0 0 .24em #d7aa5544}
  h2{font-size:clamp(38px,8vw,78px)}
  .amp{color:var(--gold)}
  .date{font-family:"Special Elite",monospace;color:var(--muted);font-size:clamp(14px,2.8vw,20px);margin:16px 0}
  .screen{background:linear-gradient(180deg,#261815,#100b0a);border:2px solid var(--gold);box-shadow:0 28px 80px #000c,inset 0 0 0 10px #0007;border-radius:6px;padding:20px;min-height:460px;display:grid;align-content:center;position:relative;overflow:hidden}
  .screen::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,#d7aa5522,transparent 34%);pointer-events:none}
  .photo-slot{border:1px dashed #8a6a3b;background:#0e0a09cc;min-height:260px;display:grid;place-items:center;text-align:center;padding:22px;color:var(--muted);position:relative;z-index:1}
  .photo-slot strong{display:block;font-family:"Bebas Neue";font-size:38px;color:var(--ink)}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
  .cd{background:#0d0908;border:1px solid #6f4e2a;border-radius:5px;padding:9px 6px;text-align:center}.cd b{display:block;font-family:"Bebas Neue";font-size:32px;line-height:1;color:#fff4dc}.cd span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{border:0;background:var(--red);color:#fff8e6;padding:13px 18px;border-radius:4px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--red2);text-transform:uppercase;letter-spacing:.8px}
  .btn.alt{background:#221815;border:1px solid var(--gold);box-shadow:0 5px 0 #0c0807}
  .btn:active{transform:translateY(4px);box-shadow:none}
  a.btn{display:inline-block;text-decoration:none;text-align:center}
  .invite-list{list-style:none;columns:2;column-gap:24px;margin-top:8px}.invite-list li{padding:8px 0;border-bottom:1px dashed #5a3d23;break-inside:avoid}
  .note{margin-top:12px;color:var(--gold);font-weight:700}
  .booth{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#120c0b,#120c0bdd);backdrop-filter:blur(10px);border-block:1px solid #6f4e2a;padding:12px 0}
  .ticket-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .ticket{position:relative;border:1px solid var(--line);background:linear-gradient(90deg,#f8dfaa,#d4a752);color:#28150d;border-radius:6px;padding:12px 10px;min-height:78px;text-align:left;cursor:pointer;box-shadow:0 10px 22px #0008}
  .ticket::after{content:"";position:absolute;top:8px;bottom:8px;right:22px;border-right:2px dashed #8f6b37}
  .ticket b{display:block;font-family:"Bebas Neue";font-size:26px;line-height:1}.ticket span{font-size:11px;text-transform:uppercase;font-weight:800}
  .ticket.done{background:linear-gradient(90deg,#9b1f1f,#5c1010);color:#fff4dc}.ticket.done::before{content:"STAMPED";position:absolute;right:34px;top:26px;transform:rotate(-12deg);font-family:"Special Elite";font-size:12px;border:2px solid currentColor;padding:3px}
  .progress{height:8px;background:#271a15;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .35s}.status{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.8px}
  main{padding:48px 0 76px}.panel{display:none;background:#191210ee;border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 24px 70px #000b}.panel.active{display:block;animation:roll .38s ease both}
  @keyframes roll{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}
  .card{background:#0d0908;border:1px solid #5a3d23;border-radius:6px;padding:16px}
  .filmstage{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;margin-top:16px}.scene-view{background:#090606;border:10px solid #080505;min-height:330px;display:grid;align-content:end;position:relative;overflow:hidden}.scene-view::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0 84%,#000b);pointer-events:none}.scene-view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.76}.scene-copy{position:relative;padding:18px}.scene-nav{display:grid;gap:10px}.scene-btn{background:#0d0908;color:var(--ink);border:1px solid #5a3d23;border-radius:5px;text-align:left;padding:14px;cursor:pointer}.scene-btn.active{border-color:var(--gold);box-shadow:0 0 0 2px #d7aa5533}.scene-btn b{display:block;font-family:"Bebas Neue";font-size:28px;line-height:1}
  .frame img{width:100%;aspect-ratio:16/10;object-fit:cover;border:8px solid #090606;background:#211}
  .pass{margin-top:18px;background:linear-gradient(135deg,#f8dfaa,#d4a752);color:#28150d;border-radius:8px;border:2px solid #7d5524;padding:18px;display:none}.pass.show{display:block;animation:roll .38s ease both}.pass h2{color:#28150d;text-shadow:none;font-size:42px}.pass p{font-weight:700}
  .detail{display:flex;gap:12px;margin:10px 0}.k{color:var(--gold);min-width:86px;font-weight:800;text-transform:uppercase;font-size:12px}
  label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.8px;margin:12px 0 5px}
  input,select,textarea{width:100%;background:#0b0908;color:var(--ink);border:1px solid #6f4e2a;border-radius:4px;padding:12px}
  .wish{border-left:4px solid var(--gold);background:#0b0908;padding:10px 12px;margin:8px 0}.wish b{display:block;color:var(--gold)}
  @media(max-width:760px){body::before{position:absolute;inset:0 0 auto 0;height:100svh;background-attachment:scroll}.invite-list{columns:1}.admit{grid-template-columns:1fr}.stub:first-child{border-radius:12px 12px 0 0}.stub:last-child{border-radius:0 0 12px 12px;border-left:2px solid #7d5524;border-top:2px dashed #7d5524}.marquee{grid-template-columns:1fr}.screen{min-height:320px}.countdown{grid-template-columns:repeat(2,1fr)}.ticket-row{display:flex;overflow:auto;padding-bottom:6px}.ticket{min-width:170px}main{padding-top:28px}.filmstage{grid-template-columns:1fr}.scene-view{min-height:280px}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="admit">
    <div class="stub">
      <div class="mono">Admit Two</div>
      <h2>Premiere Night</h2>
      <p>Break the ticket to enter the invitation.</p>
      <div class="actions"><button class="btn" onclick="enterPremiere()">Tear Ticket</button></div>
    </div>
    <div class="stub">
      <div class="mono">One Day Only</div>
      <h2 id="introNames">&nbsp;</h2>
      <p id="introDate"></p>
    </div>
  </div>
</div>
<section class="hero">
  <div class="wrap marquee">
    <div class="title">
      <div class="kicker" id="heroKicker">Interactive premiere invitation</div>
      <h1 id="names">&nbsp;</h1>
      <p class="date" id="date"></p>
      <div class="actions"><button class="btn" onclick="pick('story')">Start Screening</button><button class="btn alt" onclick="pick('rsvp')">Reserve Seat</button></div>
    </div>
    <div class="screen">
      <div class="photo-slot"><div><span class="mono" id="posterLabel">Couple photo placeholder</span><strong id="posterTitle">Your Poster Here</strong><p id="posterHint">Use your own real couple image as the poster art.</p></div></div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
</section>
<div class="booth"><div class="wrap"><div class="ticket-row" id="tickets"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status"><span id="progressText">0/5 stamped</span><span id="nowShowing">Now showing: Featurette</span></div></div></div>
<main class="wrap">
  <section class="panel active" id="panel-story"></section>
  <section class="panel" id="panel-details"></section>
  <section class="panel" id="panel-gift"></section>
  <section class="panel" id="panel-wishes"></section>
  <section class="panel" id="panel-rsvp"></section>
  <div class="pass" id="allAccess"></div>
</main>
<script src="../data.js"></script><script src="template-data.js"></script><script src="../config.local.js" onerror=""></script><script type="module" src="../firebase.js"></script><script src="../music.js" defer></script>
<script>
const W=window.WEDDING,PARAMS=new URLSearchParams(location.search),GUEST=(PARAMS.get("to")||"").trim().slice(0,40)||null,OPEN=(PARAMS.get("open")||"").trim()||null;
const T=window.TEMPLATE||{};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PHOTO_FALLBACK="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20800%20500%27%3E%3Crect%20width%3D%27800%27%20height%3D%27500%27%20fill%3D%27%23120d0b%27/%3E%3Crect%20x%3D%2732%27%20y%3D%2732%27%20width%3D%27736%27%20height%3D%27436%27%20rx%3D%2724%27%20fill%3D%27%23211816%27%20stroke%3D%27%23d8a84f%27%20stroke-dasharray%3D%2716%2014%27%20stroke-width%3D%276%27/%3E%3Ctext%20x%3D%27400%27%20y%3D%27238%27%20text-anchor%3D%27middle%27%20font-family%3D%27monospace%27%20font-size%3D%2734%27%20fill%3D%27%23f8ead0%27%3EPhoto%20placeholder%3C/text%3E%3Ctext%20x%3D%27400%27%20y%3D%27288%27%20text-anchor%3D%27middle%27%20font-family%3D%27monospace%27%20font-size%3D%2720%27%20fill%3D%27%23cdbb9c%27%3EAdd%20your%20own%20image%3C/text%3E%3C/svg%3E";
function photoFallback(img){img.onerror=null;img.src=PHOTO_FALLBACK;}
const stops=T.stops||[["story","Featurette"],["details","Screening Info"],["gift","Book Gift"],["wishes","Audience Notes"],["rsvp","Reserve Seat"]];
const seen=new Set(JSON.parse(localStorage.getItem("cinemaSeen")||"[]"));
let currentScene=0;
/* "&nbsp;" glues the ampersand to the first name so a narrow layout breaks
   cleanly as "Bride &" / "Groom" instead of stranding the "&" alone */
const NAMES_HTML=`${W.bride}&nbsp;<span class="amp">&amp;</span> ${W.groom}`;
names.innerHTML=NAMES_HTML;date.textContent=W.dateLabel;
introNames.innerHTML=NAMES_HTML;introDate.textContent=W.dateLabel;
document.documentElement.style.setProperty("--hero-art",`url("${(T.assets&&T.assets.hero)||"assets/projector.jpg"}")`);
heroKicker.textContent=(T.intro&&T.intro.kicker)||heroKicker.textContent;
document.querySelector(".stub h2").textContent=(T.intro&&T.intro.ticketTitle)||"Premiere Night";
document.querySelector(".stub p").textContent=(T.intro&&T.intro.ticketHint)||"Break the ticket to enter the invitation.";
document.querySelector(".stub .btn").textContent=(T.intro&&T.intro.enterLabel)||"Tear Ticket";
posterLabel.textContent=(T.intro&&T.intro.posterLabel)||posterLabel.textContent;
posterTitle.textContent=(T.intro&&T.intro.posterTitle)||posterTitle.textContent;
posterHint.textContent=(T.intro&&T.intro.posterHint)||posterHint.textContent;
function giftWaUrl(g){const phone=String((g&&g.whatsapp)||"").replace(/\D/g,""),text=encodeURIComponent((g&&g.whatsappText)||"Hi, I'd like to send a book as a wedding gift. Could you share the shipping address?");return phone?`https://wa.me/${phone}?text=${text}`:`https://wa.me/?text=${text}`;}
function calDates(){const d=new Date(W.date),pad=n=>String(n).padStart(2,"0"),fmt=t=>t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+"T"+pad(t.getUTCHours())+pad(t.getUTCMinutes())+"00Z";return[fmt(d),fmt(new Date(d.getTime()+5*3600e3))];}
function gcalUrl(){const[a,b]=calDates();return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(`${W.bride} & ${W.groom} Wedding`)+"&dates="+a+"/"+b+"&location="+encodeURIComponent(`${W.venueName}, ${W.venueAddress}`);}
function enterPremiere(){intro.classList.add("open");localStorage.setItem("cinemaEntered","1");setTimeout(()=>intro.classList.add("hide"),560);}
if(localStorage.getItem("cinemaEntered")==="1") intro.classList.add("hide");
function renderTickets(){tickets.innerHTML=stops.map(([id,label],i)=>`<button class="ticket ${seen.has(id)?"done":""}" onclick="pick('${id}')"><span>Admit ${String(i+1).padStart(2,"0")}</span><b>${label}</b></button>`).join("");bar.style.width=(seen.size/stops.length*100)+"%";progressText.textContent=`${seen.size}/${stops.length} stamped`;renderAllAccess();}
function pick(id){seen.add(id);localStorage.setItem("cinemaSeen",JSON.stringify([...seen]));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+id));const found=stops.find(s=>s[0]===id);nowShowing.textContent=`Now showing: ${found?found[1]:"Premiere"}`;renderTickets();document.getElementById("panel-"+id).scrollIntoView({behavior:"smooth",block:"start"});}
panelStory();
document.getElementById("panel-details").innerHTML=`<div class="mono">Now Showing</div><h2>Wedding Details</h2><div class="grid"><div class="card"><div class="detail"><span class="k">When</span><span>${W.dateLabel}<br>${W.ceremonyTime}</span></div></div><div class="card"><div class="detail"><span class="k">Where</span><span>${W.venueName}<br>${W.venueAddress}</span></div></div><div class="card"><div class="detail"><span class="k">Dress</span><span>${W.dress}</span></div></div></div>${(W.agenda&&W.agenda.length)?`<div class="card" style="margin-top:14px"><div class="mono">Run Of Show</div>${W.agenda.map(a=>`<div class="detail"><span class="k">${a.time}</span><span>${a.label}</span></div>`).join("")}</div>`:""}${(Array.isArray(W.turutMengundang)&&W.turutMengundang.length)?`<div class="card" style="margin-top:14px"><div class="mono">Turut Mengundang</div><ul class="invite-list">${W.turutMengundang.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}<div class="actions"><button class="btn alt" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Open Map</button><button class="btn alt" onclick="addToCalendar()">Add Calendar</button><a class="btn alt" href="${gcalUrl()}" target="_blank" rel="noopener">Google Calendar</a>${(W.streaming&&W.streaming.url)?`<a class="btn" href="${W.streaming.url}" target="_blank" rel="noopener">${W.streaming.label||"Watch the ceremony live"}${W.streaming.time?` · ${W.streaming.time}`:""}</a>`:""}</div>`;
document.getElementById("panel-gift").innerHTML=`<div class="mono">Concession Note</div><h2>Book Gift</h2><div class="card"><p>${W.gift.note}</p><div class="actions"><button class="btn" onclick="window.open(giftWaUrl(W.gift),'_blank')">Ask Shipping Address</button></div><p style="color:var(--muted);margin-top:10px">We only share the address through WhatsApp so it stays private.</p></div>`;
document.getElementById("panel-wishes").innerHTML=`<div class="mono">Audience Notes</div><h2>Guest Wishes</h2><form id="wishForm"><label>Your name</label><input name="name" required><label>Your wish</label><textarea name="msg" rows="3" required></textarea><div class="actions"><button class="btn">Send Note</button></div></form><p class="note" id="wishStatus" hidden></p><div id="wishList"><p style="color:var(--muted)" id="wishNote">Loading wishes...</p></div>`;
document.getElementById("panel-rsvp").innerHTML=`<div class="mono">Admission</div><h2>Reserve Your Seat</h2><form id="rsvpForm"><label>Your name</label><input name="name" required><label>Will you attend?</label><select name="attending"><option>Joyfully accepts</option><option>Sadly declines</option></select><label>Guests</label><input name="guests" type="number" min="1" value="1"><label>Note</label><textarea name="note" rows="3"></textarea><div class="actions"><button class="btn">Confirm Seat</button></div></form><p class="note" id="rsvpStatus" hidden></p>`;
function panelStory(){document.getElementById("panel-story").innerHTML=`<div class="mono">Featurette</div><h2>Our Story</h2><div class="filmstage"><div class="scene-view" id="sceneView"></div><div><div class="scene-nav" id="sceneNav"></div><div class="actions"><button class="btn alt" onclick="prevScene()">Previous Scene</button><button class="btn" onclick="nextScene()">Next Scene</button></div></div></div>`;renderScene();}
function renderScene(){const s=W.story[currentScene]||W.story[0];sceneView.innerHTML=`<img src="../photos/${s.photo}" onerror="photoFallback(this)"><div class="scene-copy"><div class="mono">Scene ${String(currentScene+1).padStart(2,"0")} · ${s.icon} ${s.label}</div><h2 style="font-size:44px">${s.title}</h2>${s.html}</div>`;sceneNav.innerHTML=W.story.map((s,i)=>`<button class="scene-btn ${i===currentScene?"active":""}" onclick="showScene(${i})"><span class="mono">Scene ${String(i+1).padStart(2,"0")}</span><b>${s.label}</b><small>${s.title}</small></button>`).join("");}
function showScene(i){currentScene=Math.max(0,Math.min(W.story.length-1,i));renderScene();}
function nextScene(){showScene((currentScene+1)%W.story.length);}
function prevScene(){showScene((currentScene-1+W.story.length)%W.story.length);}
function renderAllAccess(){const done=seen.size===stops.length, f=T.finale||{};allAccess.classList.toggle("show",done);allAccess.innerHTML=done?`<div class="mono">${f.kicker||"All Access Pass"}</div><h2>${f.title||"Premiere Complete"}</h2><p>${f.body||`You have opened every part of the invitation. The final step is simple: keep the date, find the venue, and celebrate with ${W.bride} & ${W.groom}.`}</p><div class="actions"><button class="btn" onclick="pick('rsvp')">Review RSVP</button><button class="btn alt" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Open Map</button></div>`:"";}
function tickCountdown(){const ms=new Date(W.date).getTime()-Date.now(),safe=Math.max(0,ms),d=Math.floor(safe/864e5),h=Math.floor(safe%864e5/36e5),m=Math.floor(safe%36e5/6e4),s=Math.floor(safe%6e4/1e3);countdown.innerHTML=[["Days",d],["Hours",h],["Mins",m],["Secs",s]].map(x=>`<div class="cd"><b>${String(x[1]).padStart(2,"0")}</b><span>${x[0]}</span></div>`).join("");}
function withWB(fn){const WB=window.WB;if(WB)fn(WB);else addEventListener("wb-ready",()=>fn(window.WB),{once:true});}
withWB(WB=>{const list=document.getElementById("wishList"),note=document.getElementById("wishNote");if(WB.ready)WB.watchWishes(items=>{list.innerHTML=items.length?items.map(w=>`<div class="wish"><b>${esc(w.name)}</b>${esc(w.msg)}</div>`).join(""):`<p style="color:var(--muted)">Be the first to leave a wish.</p>`});else note.textContent="Live wishes need Firebase.";});
const FAIL_MSG="We couldn't record this automatically — please WhatsApp us directly.";
function sendVia(text,subject){const wa=String(W.rsvpWhatsapp||"").replace(/\D/g,"");if(wa){open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`,"_blank");return"whatsapp";}if(W.rsvpEmail){location.href=`mailto:${W.rsvpEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;return"email";}return null;}
document.addEventListener("submit",e=>{
  if(e.target.id==="wishForm"){e.preventDefault();const d=new FormData(e.target),WB=window.WB,st=document.getElementById("wishStatus");
    if(WB&&WB.ready){WB.addWish(d.get("name"),d.get("msg"));e.target.reset();st.hidden=true;}
    else{const via=sendVia(`Wedding wish from ${d.get("name")}${GUEST?` (invitation: ${GUEST})`:""}:\n${d.get("msg")}`,`Wedding wish from ${d.get("name")}`);st.hidden=false;st.textContent=via==="whatsapp"?"Your note was sent via WhatsApp — thank you!":via==="email"?"We opened your e-mail app — press send to deliver your note.":FAIL_MSG;if(via)e.target.reset();}}
  if(e.target.id==="rsvpForm"){e.preventDefault();const d=new FormData(e.target),data={name:d.get("name"),attending:d.get("attending"),guests:d.get("guests"),note:d.get("note"),to:GUEST||""},WB=window.WB,st=document.getElementById("rsvpStatus");
    if(WB&&WB.ready){WB.addRSVP(data);e.target.outerHTML=`<div class="card"><h2 style="font-size:36px">Seat Reserved</h2><p>Thank you, ${esc(data.name)||"friend"}. Your RSVP is in.</p></div>`;}
    else{const via=sendVia(`RSVP — ${data.name}\nAttending: ${data.attending}\nGuests: ${data.guests}${data.note?`\nNote: ${data.note}`:""}${GUEST?`\nInvitation for: ${GUEST}`:""}`,`RSVP — ${data.name}`);
      if(via){e.target.outerHTML=`<div class="card"><h2 style="font-size:36px">Seat Reserved</h2><p>Thank you, ${esc(data.name)||"friend"}. ${via==="whatsapp"?"Your RSVP was sent via WhatsApp.":"We opened your e-mail app — press send to deliver your RSVP."}</p></div>`;}
      else{st.hidden=false;st.textContent=FAIL_MSG;}}}
});
window.addToCalendar=function(){const[start,end]=calDates(),ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`SUMMARY:${W.bride} & ${W.groom} Wedding`,`DTSTART:${start}`,`DTEND:${end}`,`LOCATION:${W.venueName}, ${W.venueAddress}`,"END:VEVENT","END:VCALENDAR"].join("\n"),url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})),a=document.createElement("a");a.href=url;a.download="wedding.ics";a.click();URL.revokeObjectURL(url)}
tickCountdown();
setInterval(tickCountdown,1000);
renderTickets();
if(OPEN){const si=W.story.findIndex(s=>s.id===OPEN);if(si>=0||stops.some(s=>s[0]===OPEN)){intro.classList.add("hide");if(si>=0)showScene(si);addEventListener("load",()=>pick(si>=0?"story":OPEN));}}
</script>
</body>
</html>
