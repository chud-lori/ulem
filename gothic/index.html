<style>
  :root{--bg:#070608;--ink:#f3e7d9;--muted:#b9a999;--wine:#76152d;--wine2:#2b0710;--gold:#b99b64;--panel:#151116;--line:#4b3d43}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Crimson Text",Georgia,serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--hero-art, url("assets/stilllife.jpg")) center/cover no-repeat;filter:brightness(.43) saturate(.88)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 18%,transparent 0 22%,#070608aa 55%,#070608 100%),linear-gradient(90deg,#070608 0 12%,transparent 45% 55%,#070608 88%)}
  button,input,select,textarea{font:inherit}
  .wrap{width:min(1080px,calc(100% - 28px));margin:auto}
  .hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:34px 0}
  .gate{width:min(860px,100%);border:1px solid var(--line);border-radius:260px 260px 12px 12px;background:linear-gradient(180deg,#171117e6,#09080be6);box-shadow:0 38px 100px #000,inset 0 0 70px #76152d24;padding:44px 22px 28px;position:relative;overflow:hidden}
  .gate::before{content:"";position:absolute;inset:16px;border:1px solid #ffffff12;border-radius:240px 240px 8px 8px;pointer-events:none}
  .gate.unsealed{animation:unseal .7s ease both}
  @keyframes unseal{50%{box-shadow:0 38px 100px #000,inset 0 0 110px #b99b6455}100%{box-shadow:0 38px 100px #000,inset 0 0 70px #76152d24}}
  .rune{font-family:Cinzel,serif;color:#c59aa4;letter-spacing:5px;text-transform:uppercase;font-size:12px}
  h1,h2{font-family:Cinzel,serif;letter-spacing:2px;text-transform:uppercase;line-height:1.05}
  h1{font-size:clamp(42px,10vw,104px);color:#fff0dd;text-shadow:0 0 26px #76152d88;margin:16px 0}
  h2{font-size:clamp(30px,7vw,66px);color:#fff0dd}
  .amp{color:#c79ba3}.sub{color:var(--muted);font-style:italic}
  .seal{width:112px;height:112px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 32%,#b53852,#701428 62%,#320810);display:grid;place-items:center;border:3px solid #d0a6a6;box-shadow:0 12px 40px #000,inset 0 0 22px #210207;color:#fff0dd;font-family:Cinzel,serif;font-weight:800;letter-spacing:2px;cursor:pointer;position:relative;z-index:1}
  .seal::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1px solid #d0a6a644;opacity:0;transform:scale(.8)}
  .seal.open{animation:breakSeal .72s cubic-bezier(.2,.8,.2,1) both}
  .seal.open::after{animation:sealRing .72s ease both}
  @keyframes breakSeal{30%{transform:scale(1.12) rotate(4deg)}100%{transform:rotate(-14deg) scale(.9);opacity:.72}}
  @keyframes sealRing{to{opacity:1;transform:scale(1.55)}}
  .btn{background:var(--wine);color:#fff0dd;border:1px solid #ad7180;padding:12px 18px;font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
  .btn.alt{background:#151216;border-color:var(--line)}
  .archive{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:46px 0 76px}
  .objects{position:sticky;top:18px;align-self:start;background:#100d12e8;border:1px solid var(--line);box-shadow:0 22px 70px #000b;padding:18px;border-radius:8px}
  .objects h2{font-size:30px}.meter{height:8px;background:#241a20;border-radius:99px;overflow:hidden;margin:12px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .35s}
  .relics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .relic{min-height:110px;background:linear-gradient(180deg,#1a151c,#0b090d);border:1px solid #5b4750;color:var(--ink);cursor:pointer;padding:12px;text-align:left;box-shadow:inset 0 0 22px #0008}
  .relic b{display:block;font-family:Cinzel,serif;font-size:15px;color:#e5c5ca}.relic span{display:block;color:var(--muted);font-size:14px;margin-top:4px}.relic.done{border-color:#b99b64;box-shadow:0 0 24px #b99b6422,inset 0 0 22px #0008}
  .glyph{font-size:30px;line-height:1;margin-bottom:10px}
  .panel{display:none;background:#141116ef;border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 24px 80px #000c}.panel.active{display:block;animation:wake .42s ease both}
  @keyframes wake{from{opacity:0;filter:blur(6px);transform:translateY(16px)}to{opacity:1;filter:none;transform:none}}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{background:#08070a;border:1px solid #46383f;padding:16px}
  .photo-slot{border:1px dashed #6a5960;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:18px;background:#08070abb}.photo-slot strong{display:block;font-family:Cinzel,serif;color:var(--ink);font-size:22px}
  .story img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(.18);border:1px solid #46383f;background:#211}
  .letter{display:none;margin-top:18px;background:linear-gradient(180deg,#20191b,#0e0b0d);border:1px solid var(--gold);padding:22px;box-shadow:0 0 42px #b99b6424}.letter.show{display:block;animation:wake .42s ease both}.letter h2{font-size:36px}.letter p{font-size:20px}
  .detail{display:flex;gap:12px;margin:10px 0}.k{min-width:82px;color:#c59aa4;font-family:Cinzel,serif;font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}label{display:block;color:var(--muted);font-family:Cinzel,serif;text-transform:uppercase;font-size:12px;letter-spacing:1px;margin:12px 0 4px}
  input,select,textarea{width:100%;background:#08070a;color:var(--ink);border:1px solid var(--line);padding:12px}.wish{background:#08070a;border-left:4px solid var(--wine);padding:10px 12px;margin:8px 0}.wish b{display:block;color:#d6b1b8}
  .countdown{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 6px}.cd{border:1px solid var(--line);background:#0b090dcc;padding:8px 12px;min-width:68px;font-family:Cinzel,serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.cd b{display:block;font-size:26px;color:var(--gold)}
  .prog{margin-top:16px;border-left:1px solid var(--gold);padding:4px 0 4px 20px}.prog .row{position:relative;margin:14px 0}.prog .row::before{content:"";position:absolute;left:-24px;top:9px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}.prog b{font-family:Cinzel,serif;color:#e5c5ca;letter-spacing:1px;margin-right:10px}
  .tm{list-style:none;margin-top:12px}.tm li{background:#08070a;border:1px solid #46383f;border-left:4px solid var(--gold);padding:10px 12px;margin:8px 0}
  .form-err{margin-top:12px;color:#e8a2a2;background:#1c0b10;border:1px dashed var(--wine);padding:10px 12px}
  @media(max-width:820px){.archive{grid-template-columns:1fr}.objects{position:relative;top:auto}.relic{min-height:96px}.gate{padding-top:36px}
    /* fixed full-viewport background repaints every frame on iOS — let it scroll away instead */
    body::before{position:absolute;inset:0 0 auto;height:100vh;height:100lvh}}
</style>
</head>
<body>

<script src="../data.js"></script><script src="template-data.js"></script><script src="../config.local.js" onerror=""></script><script type="module" src="../firebase.js"></script><script src="../music.js" defer></script>
<script>
const W=window.WEDDING,GUEST=(new URLSearchParams(location.search).get("to")||"").trim().slice(0,40)||null;
const T=window.TEMPLATE||{};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PHOTO_FALLBACK="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20800%20600%27%3E%3Crect%20width%3D%27800%27%20height%3D%27600%27%20fill%3D%27%2308070a%27/%3E%3Crect%20x%3D%2740%27%20y%3D%2740%27%20width%3D%27720%27%20height%3D%27520%27%20rx%3D%2718%27%20fill%3D%27%23141116%27%20stroke%3D%27%23b99b64%27%20stroke-dasharray%3D%2718%2014%27%20stroke-width%3D%276%27/%3E%3Ctext%20x%3D%27400%27%20y%3D%27286%27%20text-anchor%3D%27middle%27%20font-family%3D%27serif%27%20font-size%3D%2738%27%20fill%3D%27%23f3e7d9%27%3EPhoto%20placeholder%3C/text%3E%3Ctext%20x%3D%27400%27%20y%3D%27338%27%20text-anchor%3D%27middle%27%20font-family%3D%27serif%27%20font-size%3D%2722%27%20fill%3D%27%23b9a999%27%3EAdd%20your%20own%20image%3C/text%3E%3C/svg%3E";
function photoFallback(img){img.onerror=null;img.src=PHOTO_FALLBACK;}
document.documentElement.style.setProperty("--hero-art",`url("${(T.assets&&T.assets.hero)||"assets/stilllife.jpg"}")`);
if(T.seal){sealKicker.textContent=T.seal.kicker||sealKicker.textContent;seal.textContent=T.seal.label||seal.textContent;sealPrimary.textContent=T.seal.primary||sealPrimary.textContent;sealSecondary.textContent=T.seal.secondary||sealSecondary.textContent;}
const relicData=T.relics||[["portrait","Frame","Your real photo"],["story","Book","Our story"],["details","Key","Details"],["programme","Scroll","The programme"],["gift","Seal","Book gift"],["wishes","Ink","Wishes"],["rsvp","Candle","RSVP"]];
const seen=new Set(JSON.parse(localStorage.getItem("gothicSeen")||"[]"));
names.innerHTML=`${W.bride}<span class="amp"> &amp; </span>${W.groom}`;date.textContent=W.dateLabel;
function giftWaUrl(g){const phone=String((g&&g.whatsapp)||"").replace(/\D/g,""),text=encodeURIComponent((g&&g.whatsappText)||"Hi, I'd like to send a book as a wedding gift. Could you share the shipping address?");return phone?`https://wa.me/${phone}?text=${text}`:`https://wa.me/?text=${text}`;}
function openArchive(){seal.classList.add("open");document.querySelector(".gate").classList.add("unsealed");document.getElementById("archive").scrollIntoView({behavior:"smooth"});}
function renderRelics(){const complete=seen.size>=relicData.length;relics.innerHTML=relicData.map(([id,name,hint])=>`<button class="relic ${seen.has(id)?"done":""}" onclick="pick('${id}')"><div class="glyph">${mark(id)}</div><b>${name}</b><span>${hint}</span></button>`).join("")+`<button class="relic ${complete?"done":""}" ${complete?"onclick=\"pick('letter')\"":"disabled"}><div class="glyph">LETTER</div><b>Final Letter</b><span>${complete?"Unlocked":"Collect every mark"}</span></button>`;bar.style.width=(Math.min(seen.size,relicData.length)/relicData.length*100)+"%";}
function mark(id){return {portrait:"FRAME",story:"BOOK",details:"KEY",programme:"SCROLL",gift:"SEAL",wishes:"INK",rsvp:"LIGHT"}[id];}
function pick(id){if(id!=="letter")seen.add(id);localStorage.setItem("gothicSeen",JSON.stringify([...seen]));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+id));renderRelics();openArchive();}
const tm=(W.turutMengundang||[]).length?`<div class="rune" style="margin-top:24px">Turut Mengundang</div><ul class="tm">${W.turutMengundang.map(t=>`<li>${t}</li>`).join("")}</ul>`:"";
document.getElementById("panel-portrait").innerHTML=`<div class="rune">Portrait chamber</div><h2>Your Photo Belongs Here</h2><div class="photo-slot"><div><strong>Couple photo placeholder</strong><p>Put your own real portrait asset here. This template uses generated object art only.</p></div></div>${tm}`;
document.getElementById("panel-story").innerHTML=`<div class="rune">Chapters</div><h2>Our Story</h2><div class="grid story">${W.story.map(s=>`<article class="card" id="story-${esc(s.id)}"><img src="../photos/${s.photo}" onerror="photoFallback(this)"><div class="rune" style="margin-top:10px">${s.icon} ${s.label}</div><h2 style="font-size:30px">${s.title}</h2>${s.html}</article>`).join("")}</div>`;
const streamCard=(W.streaming&&W.streaming.url)?`<div class="card" style="margin-top:14px"><div class="detail"><span class="k">Live</span><span>For those kept far away, the ceremony is carried by candlelight and signal.${W.streaming.time?`<br>${W.streaming.time}`:""}</span></div><div class="actions"><button class="btn" onclick="window.open(W.streaming.url,'_blank')">${W.streaming.label||"Watch the ceremony live"}</button></div></div>`:"";
document.getElementById("panel-details").innerHTML=`<div class="rune">The appointed day</div><h2>Wedding Details</h2><div class="grid"><div class="card"><div class="detail"><span class="k">When</span><span>${W.dateLabel}<br>${W.ceremonyTime}</span></div></div><div class="card"><div class="detail"><span class="k">Where</span><span>${W.venueName}<br>${W.venueAddress}</span></div></div><div class="card"><div class="detail"><span class="k">Attire</span><span>${W.dress}</span></div></div></div>${streamCard}<div class="actions"><button class="btn alt" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Map</button><button class="btn alt" onclick="addToCalendar()">Calendar</button><button class="btn alt" onclick="window.open(gcalUrl(),'_blank')">Google Calendar</button></div>`;
document.getElementById("panel-programme").innerHTML=`<div class="rune">In order of appearance</div><h2>The Programme</h2><p class="sub">${W.dateLabel}</p><div class="prog">${(W.agenda||[]).map(a=>`<div class="row"><b>${a.time}</b>${a.label}</div>`).join("")||`<div class="row"><b>${W.ceremonyTime}</b>Wedding ceremony</div>`}</div>`;
document.getElementById("panel-gift").innerHTML=`<div class="rune">In lieu of gifts</div><h2>Book Gift</h2><div class="card"><p>${W.gift.note}</p><div class="actions"><button class="btn" onclick="window.open(giftWaUrl(W.gift),'_blank')">Ask Shipping Address</button></div><p class="sub" style="margin-top:10px">We only share the address through WhatsApp so it stays private.</p></div>`;
document.getElementById("panel-wishes").innerHTML=`<div class="rune">Guestbook</div><h2>Wishes</h2><form id="wishForm"><label>Your name</label><input name="name" required><label>Your wish</label><textarea name="msg" rows="3" required></textarea><div class="actions"><button class="btn">Send Wish</button></div></form><div id="wishList"><p class="sub" id="wishNote">Loading wishes...</p></div>`;
document.getElementById("panel-rsvp").innerHTML=`<div class="rune">Reply</div><h2>RSVP</h2><form id="rsvpForm"><label>Your name</label><input name="name" required><label>Will you attend?</label><select name="attending"><option>Joyfully accepts</option><option>Sadly declines</option></select><label>Guests</label><input name="guests" type="number" min="1" value="1"><label>Note</label><textarea name="note" rows="3"></textarea><div class="actions"><button class="btn">Send RSVP</button></div></form>`;
{ const f=T.finalLetter||{}; document.getElementById("panel-letter").innerHTML=`<div class="rune">${f.kicker||"The last page"}</div><h2>${f.title||"Letter From The Archive"}</h2><div class="letter show"><p>${f.body||"Every mark has been opened. Keep this date close."} ${W.dateLabel}. ${W.bride} &amp; ${W.groom}.</p><div class="actions"><button class="btn" onclick="pick('rsvp')">Reply Again</button><button class="btn alt" onclick="window.open('https://maps.google.com/?q='+encodeURIComponent(W.mapsQuery),'_blank')">Find The Venue</button></div></div>`; }
function withWB(fn){const WB=window.WB;if(WB)fn(WB);else addEventListener("wb-ready",()=>fn(window.WB),{once:true})}
withWB(WB=>{if(WB.ready)WB.watchWishes(items=>wishList.innerHTML=items.length?items.map(w=>`<div class="wish"><b>${esc(w.name)}</b>${esc(w.msg)}</div>`).join(""):`<p class="sub">Be the first to leave a wish.</p>`);else wishNote.textContent="Live wishes need Firebase."});
function sendFallback(subject,text){const wa=String(W.rsvpWhatsapp||"").replace(/\D/g,"");if(wa){open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`,"_blank");return "wa";}if(W.rsvpEmail){location.href=`mailto:${W.rsvpEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;return "mail";}return null;}
function formErr(form,msg){let n=form.querySelector(".form-err");if(!n){n=document.createElement("p");n.className="form-err";form.appendChild(n);}n.textContent=msg;}
document.addEventListener("submit",e=>{if(e.target.id==="wishForm"){e.preventDefault();const d=new FormData(e.target),WB=window.WB,name=d.get("name"),msg=d.get("msg");if(WB&&WB.ready){WB.addWish(name,msg);e.target.reset();}else{const how=sendFallback(`Wedding wish from ${name}`,`Wedding wish from ${name}:\n${msg}`);if(how){e.target.reset();const note=document.getElementById("wishNote");if(note)note.textContent=how==="wa"?"Your wish opened in WhatsApp — hit send there and it reaches the archive.":"Your e-mail app opened with the wish — just hit send.";}else formErr(e.target,"Alas — the wish could not be delivered right now. Please tell us directly.");}} if(e.target.id==="rsvpForm"){e.preventDefault();const d=new FormData(e.target),data={name:d.get("name"),attending:d.get("attending"),guests:d.get("guests"),note:d.get("note"),to:GUEST||""},WB=window.WB;if(WB&&WB.ready){WB.addRSVP(data);e.target.outerHTML=`<div class="card"><h2 style="font-size:34px">Reply Received</h2><p>Thank you, ${esc(data.name)||"friend"}. Your RSVP is in.</p></div>`;}else{const how=sendFallback(`RSVP — ${data.name}`,`RSVP\nName: ${data.name}\nAttending: ${data.attending}\nGuests: ${data.guests}${data.note?`\nNote: ${data.note}`:""}${GUEST?`\nInvitation for: ${GUEST}`:""}`);if(how==="wa")e.target.outerHTML=`<div class="card"><h2 style="font-size:34px">Carried By WhatsApp</h2><p>Thank you, ${esc(data.name)||"friend"}. Your reply opened in WhatsApp — just hit send there.</p></div>`;else if(how==="mail")e.target.outerHTML=`<div class="card"><h2 style="font-size:34px">One Seal Remains</h2><p>Thank you, ${esc(data.name)||"friend"}. Your e-mail app opened with the reply — just hit send.</p></div>`;else formErr(e.target,"Alas — your reply could not be recorded right now. Please contact us directly to confirm.");}}});
window.addToCalendar=function(){const d=new Date(W.date),pad=n=>String(n).padStart(2,"0"),fmt=t=>t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+"T"+pad(t.getUTCHours())+pad(t.getUTCMinutes())+"00Z",end=new Date(d.getTime()+5*3600e3),ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`SUMMARY:${W.bride} & ${W.groom} Wedding`,`DTSTART:${fmt(d)}`,`DTEND:${fmt(end)}`,`LOCATION:${W.venueName}, ${W.venueAddress}`,"END:VEVENT","END:VCALENDAR"].join("\n"),url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})),a=document.createElement("a");a.href=url;a.download="wedding.ics";a.click();URL.revokeObjectURL(url)}
window.gcalUrl=function(){const d=new Date(W.date),pad=n=>String(n).padStart(2,"0"),fmt=t=>t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+"T"+pad(t.getUTCHours())+pad(t.getUTCMinutes())+"00Z",end=new Date(d.getTime()+5*3600e3);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(`${W.bride} & ${W.groom} Wedding`)+"&dates="+fmt(d)+"/"+fmt(end)+"&location="+encodeURIComponent(`${W.venueName}, ${W.venueAddress}`)+"&details="+encodeURIComponent(W.dateLabel+" · "+W.ceremonyTime);};
(function(){const el=document.getElementById("countdown");if(!el||!W.date)return;const t=new Date(W.date).getTime();if(isNaN(t))return;function tick(){const ms=t-Date.now();if(ms<=0){el.innerHTML=`<div class="cd"><b>Tonight</b>the hour has come</div>`;clearInterval(iv);return;}const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;el.innerHTML=[[d,"days"],[h,"hours"],[m,"min"],[s,"sec"]].map(([v,l])=>`<div class="cd"><b>${v}</b>${l}</div>`).join("");}const iv=setInterval(tick,1000);tick();})();
renderRelics();
(function(){const o=(new URLSearchParams(location.search).get("open")||"").trim().slice(0,40);if(!o||o==="letter")return;const isStory=(W.story||[]).some(s=>s.id===o);const id=document.getElementById("panel-"+o)?o:(isStory?"story":null);if(!id)return;pick(id);if(isStory){const el=document.getElementById("story-"+o);if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),400);}})();
</script>
